title: Yue Zhang
role: Postdoctoral Researcher, Monash University
description: >-
  Yue Zhang is a postdoctoral researcher at Monash University specialising in multi-agent path finding (MAPF). Her work on lifelong MAPF, online task assignment, and robust execution has been published at AAAI, ICAPS, and AAMAS. She also co-organises the League of Robot Runners and contributes to its Start-Kit.
