title: Jingjin Yu
role: Associate Professor, Rutgers University
description: >-
  Jingjin Yu is an Associate Professor of Computer Science and Siemens Scholar in Robotics and Physical AI. His research spans robot learning for manipulation, task and motion planning, multi-robot systems, and sensor fusion. An IEEE RAS Distinguished Lecturer, he has received the NSF CAREER Award and the Amazon Research Award.
