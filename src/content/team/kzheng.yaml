title: Kevin Zheng
role: Research Engineer, Monash University
description: >-
  Kevin Zheng is a researcher, engineer and teaching staff at Monash University focusing on automated planning and intelligent decision-making. He co-hosted the Optimisation and Planning Summer School in 2025, and maintains tools that serve the planning community, like Posthoc and the MAPF Tracker. His work has been published and recognized with awards at ICAPS 2024 and 2025.
