title: Kevin Zheng
role: Research Engineer, Monash University
description: >-
  Kevin Zheng is a researcher, engineer and teaching staff at Monash University focusing on automated planning. He co-hosted the 2025 Optimisation and Planning Summer School, and maintains tools for the planning community, like Posthoc and MAPF Tracker. His work has been published and recognised with awards at ICAPS 2024 and 2025.
